<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตารางคะแนนลีก 2026/27</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        premier: '#38003c',
                        accent: '#00ff87',
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header class="bg-premier text-white py-5 shadow">
        <div class="container mx-auto px-4 flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                <i class="fa fa-futbol-o text-accent"></i> ตารางคะแนนลีก 2026/27
            </h1>
            <a href="login.html" class="bg-accent text-premier px-4 py-2 rounded font-medium hover:bg-accent/90">
                <i class="fa fa-cog mr-1"></i> ผู้ดูแล
            </a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-4xl">
        <div class="bg-white rounded-xl shadow overflow-hidden">
            <div class="bg-premier text-white p-4">
                <h2 class="text-lg font-semibold">อันดับและสถิติทีม</h2>
                <p class="text-sm text-gray-300">อัปเดตล่าสุด: <span id="update-time">--/--/---- --:--</span></p>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-center">
                    <thead class="bg-gray-100 text-gray-700">
                        <tr>
                            <th class="py-3 px-2">#</th>
                            <th class="py-3 px-3 text-left">ทีม</th>
                            <th class="py-3 px-2">MP</th>
                            <th class="py-3 px-2">W</th>
                            <th class="py-3 px-2">D</th>
                            <th class="py-3 px-2">L</th>
                            <th class="py-3 px-2">GF</th>
                            <th class="py-3 px-2">GA</th>
                            <th class="py-3 px-2">GD</th>
                            <th class="py-3 px-2 font-bold">Pts</th>
                        </tr>
                    </thead>
                    <tbody id="standings-body"></tbody>
                </table>
            </div>
        </div>
        <p class="text-center text-gray-500 text-sm mt-4">
            MP=นัด, W=ชนะ, D=เสมอ, L=แพ้, GF=ได้, GA=เสีย, GD=ต่างประตู, Pts=คะแนน
        </p>
    </main>

    <script>
     <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-database-compat.js"></script>
<script>
    const FIREBASE_URL = "https://bukit-power-union-cup-default-rtdb.asia-southeast1.firebasedatabase.app/";
    
    const defaultData = [
        { id: 1, name: 'Arsenal', mp: 10, w: 9, d: 0, l: 1, gf: 25, ga: 5, gd: 20, pts: 27 },
        { id: 2, name: 'Brighton', mp: 10, w: 7, d: 1, l: 2, gf: 26, ga: 7, gd: 19, pts: 22 },
        { id: 3, name: 'Manchester City', mp: 10, w: 7, d: 0, l: 3, gf: 21, ga: 13, gd: 8, pts: 21 },
        { id: 4, name: 'Liverpool', mp: 10, w: 5, d: 3, l: 2, gf: 14, ga: 10, gd: 4, pts: 18 },
        { id: 5, name: 'Chelsea', mp: 10, w: 5, d: 1, l: 4, gf: 19, ga: 16, gd: 3, pts: 16 },
        { id: 6, name: 'Everton', mp: 10, w: 4, d: 4, l: 2, gf: 12, ga: 10, gd: 2, pts: 16 }
    ];

    let teams = [];
    
    function initFirebase() {
        const firebaseConfig = { databaseURL: FIREBASE_URL };
        if (!window.firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
    }

    function sortTeams() {
        teams.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
    }

    function renderTable() {
        sortTeams();
        const tbody = document.getElementById('standings-body');
        tbody.innerHTML = '';
        teams.forEach((team, i) => {
            const row = document.createElement('tr');
            row.className = 'border-b hover:bg-gray-50' + (i === 0 ? ' bg-yellow-50' : i < 4 ? ' bg-green-50/30' : '');
            row.innerHTML = `
                <td class="py-3 font-bold">${i + 1}</td>
                <td class="py-3 text-left font-medium">${team.name}</td>
                <td class="py-3">${team.mp}</td>
                <td class="py-3 text-green-600">${team.w}</td>
                <td class="py-3 text-gray-500">${team.d}</td>
                <td class="py-3 text-red-500">${team.l}</td>
                <td class="py-3">${team.gf}</td>
                <td class="py-3">${team.ga}</td>
                <td class="py-3 ${team.gd > 0 ? 'text-green-600' : team.gd < 0 ? 'text-red-500' : ''}">${team.gd > 0 ? '+' : ''}${team.gd}</td>
                <td class="py-3 font-bold text-purple-900">${team.pts}</td>
            `;
            tbody.appendChild(row);
        });
    }

    async function loadData() {
        initFirebase();
        const db = firebase.database();
        const ref = db.ref('teams');
        
        ref.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                ref.set(defaultData);
                teams = [...defaultData];
            } else {
                teams = Object.values(data);
            }
            renderTable();
            document.getElementById('update-time').textContent = new Date().toLocaleString('th-TH');
        });
    }

    loadData();
</script>

    </script>
</body>
</html>
