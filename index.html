<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ตารางคะแนนลีก 2026/27</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- หัวเว็บ -->
    <header class="bg-purple-900 text-white py-4 px-6 flex justify-between items-center">
        <h1 class="text-xl font-bold">⚽ ตารางคะแนนลีก 2026/27</h1>
        <a href="login.html" class="bg-green-400 text-black px-4 py-2 rounded font-medium">ผู้ดูแล</a>
    </header>

    <!-- ตาราง -->
    <main class="max-w-4xl mx-auto mt-8 px-4">
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <div class="bg-purple-900 text-white p-4">
                <h2 class="text-lg font-bold">อันดับและสถิติทีม</h2>
                <p class="text-sm text-purple-200">อัปเดตล่าสุด: <span id="update-time">--/--/---- --:--</span></p>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-center">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="py-3 px-2">#</th>
                            <th class="py-3 px-3 text-left">ทีม</th>
                            <th class="py-3 px-2">MP</th>
                            <th class="py-3 px-2">W</th>
                            <th class="py-3 px-2">D</th>
                            <th class="py-3 px-2">L</th>
                            <th class="py-3 px-2">GF</th>
                            <th class="py-3 px-2">GA</th>
                            <th class="py-3 px-2">GD</th>
                            <th class="py-3 px-2 font-bold">Pts</th>
                        </tr>
                    </thead>
                    <tbody id="standings-body">
                        <!-- ข้อมูลจะแสดงที่นี่ -->
                    </tbody>
                </table>
            </div>

            <p class="text-center text-gray-500 text-sm py-3">
                MP=นัด, W=ชนะ, D=เสมอ, L=แพ้, GF=ได้, GA=เสีย, GD=ผลต่าง, Pts=คะแนน
            </p>
        </div>
    </main>

    <script>
        const defaultData = [
            { id: 1, name: 'Arsenal', mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 },
            { id: 2, name: 'Brighton', mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 },
            { id: 3, name: 'Manchester City', mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 },
            { id: 4, name: 'Liverpool', mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 },
            { id: 5, name: 'Chelsea', mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 },
            { id: 6, name: 'Everton', mp: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, gd: 0, pts: 0 }
        ];

        let teams = JSON.parse(localStorage.getItem('leagueData')) || defaultData;

        function sortTeams() {
            teams.sort((a, b) => b.pts - a.pts || b.gd - a.gd || b.gf - a.gf);
        }

        function renderTable() {
            sortTeams();
            const tbody = document.getElementById('standings-body');
            tbody.innerHTML = '';

            teams.forEach((team, i) => {
                const row = document.createElement('tr');
                row.className = 'border-b hover:bg-gray-50' + (i === 0 ? ' bg-yellow-50' : '');
                row.innerHTML = `
                    <td class="py-3 font-bold">${i + 1}</td>
                    <td class="py-3 text-left font-medium">${team.name}</td>
                    <td class="py-3">${team.mp}</td>
                    <td class="py-3 text-green-600">${team.w}</td>
                    <td class="py-3 text-gray-500">${team.d}</td>
                    <td class="py-3 text-red-500">${team.l}</td>
                    <td class="py-3">${team.gf}</td>
                    <td class="py-3">${team.ga}</td>
                    <td class="py-3 ${team.gd > 0 ? 'text-green-600' : team.gd < 0 ? 'text-red-500' : ''}">${team.gd > 0 ? '+' : ''}${team.gd}</td>
                    <td class="py-3 font-bold text-purple-900">${team.pts}</td>
                `;
                tbody.appendChild(row);
            });

            document.getElementById('update-time').textContent = localStorage.getItem('lastUpdate') || '--/--/---- --:--';
        }

        renderTable();
    </script>
</body>
</html>
